name = "sambungla-edge"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "sambungla-db"
database_id = "8a5b519b-1da4-42cc-913f-f0f183d34904"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "3d4c6db63bb9485ba2d582477be71af8"

[vars]
NEXTAUTH_URL = "sambungla.pages.dev"
APP_ENV = "development"

# Secrets (set via `wrangler pages secret put`, never committed):
# OPENAI_API_KEY
# AUTH_SECRET
# LINKEDIN_CLIENT_ID
# LINKEDIN_CLIENT_SECRET
