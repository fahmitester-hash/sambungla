name = "sambungla-edge-cron"
main = "worker-cron.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sambungla-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]

[vars]
APP_BASE_URL = "https://sambungla-edge.pages.dev"

# Secrets (set via `wrangler secret put --config wrangler-cron.toml`):
# OPENAI_API_KEY   (regenerates writing-style profile after each auto-publish)
